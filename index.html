<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNK Governance Dashboard - School Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        /* ธีมสีน้ำตาล-ครีม สไตล์โรงเรียน */
        body {
            background-color: #fcf8f2;
            color: #4a3b32;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .school-card {
            background-color: #fffdf9;
            border: 2px solid #e6d7c3;
        }
        .school-header {
            background-color: #795548;
            color: #fffefb;
        }
        .school-btn {
            background-color: #8d6e63;
            color: #ffffff;
            transition: background-color 0.2s;
        }
        .school-btn:hover {
            background-color: #6d4c41;
        }
        .school-table-header {
            background-color: #efebe9;
            color: #5d4037;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Tab สำหรับรองรับ Token แบบใหม่ในอนาคต -->
        <div class="flex gap-2 border-b border-[#d7ccc8] pb-2">
            <button onclick="switchToken('BNK')" id="tab-BNK" class="px-4 py-2 rounded-lg font-bold school-btn shadow-sm">
                BNK Governance Token
            </button>
            <button onclick="switchToken('NEW')" id="tab-NEW" class="px-4 py-2 rounded-lg font-semibold bg-[#d7ccc8] text-[#5d4037] hover:bg-[#c5b9b6] transition-colors">
                New Token (Coming Soon)
            </button>
        </div>

        <!-- Header -->
        <div class="school-card p-6 rounded-xl shadow-md flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold" id="tokenName">BNK Governance Token</h1>
                <p class="text-[#8d6e63]" id="tokenSymbol">Loading...</p>
            </div>
            <div class="text-center md:text-right">
                <p class="text-sm text-[#8d6e63]">Total Supply</p>
                <p class="text-2xl font-bold text-[#5d4037]" id="totalSupply">0 BNK</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Leaderboard Container (แทนที่กราฟ) -->
            <div class="school-card p-6 rounded-xl shadow-md col-span-1 lg:col-span-1 flex flex-col">
                <h2 class="text-xl font-bold mb-4 border-b pb-2 border-[#d7ccc8]">🏆 จัดอันดับผู้ถือเหรียญสูงสุด</h2>
                <div class="overflow-x-auto max-h-[450px] overflow-y-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead class="sticky top-0 school-table-header">
                            <tr class="border-b border-[#d7ccc8]">
                                <th class="p-2 text-center w-12">#</th>
                                <th class="p-2">ชื่อ (Who)</th>
                                <th class="p-2 text-right">จำนวน (BNK)</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboardBody">
                            <tr>
                                <td colspan="3" class="p-4 text-center text-[#8d6e63]">กำลังโหลดจัดอันดับ...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Real-time Transactions Container -->
            <div class="school-card p-6 rounded-xl shadow-md col-span-1 lg:col-span-2">
                <h2 class="text-xl font-bold mb-4 border-b pb-2 border-[#d7ccc8]">📜 Live Transfers (Real-time)</h2>
                <div class="overflow-x-auto max-h-[450px] overflow-y-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="sticky top-0 school-table-header">
                            <tr class="border-b border-[#d7ccc8]">
                                <th class="p-3">From (Who)</th>
                                <th class="p-3">To (Who)</th>
                                <th class="p-3 text-right">Amount</th>
                            </tr>
                        </thead>
                        <tbody id="txTableBody">
                            <!-- ข้อมูล Real-time จะเพิ่มที่นี่ -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ตั้งค่า Token ปัจจุบัน (สามารถสลับไป token อื่นได้ง่ายในอนาคต)
        let currentTokenConfig = {
            name: "BNK Governance Token",
            symbol: "BNK",
            contractAddress: "0xA992ad80Fa6136702382123Ae717890Bc587491d"
        };

        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSuX8P2ftAdB_U1rv9j2eWozaD-1F216lIpVOjCIIf4JbffXzt-aa_JVZmttXNPM1DwBSMssUF0-CRM/pub?output=csv";

        const ABI = [
            "function name() view returns (string)",
            "function symbol() view returns (string)",
            "function totalSupply() view returns (uint256)",
            "function balanceOf(address account) view returns (uint256)",
            "event Transfer(address indexed from, address indexed to, uint256 value)"
        ];

        let walletMapping = {};
        let whoBalances = {}; 

        // ฟังก์ชันสลับหน้า Token (เตรียมรองรับ Token ใหม่)
        function switchToken(tokenKey) {
            const btnBnk = document.getElementById('tab-BNK');
            const btnNew = document.getElementById('tab-NEW');

            if(tokenKey === 'BNK') {
                btnBnk.className = "px-4 py-2 rounded-lg font-bold school-btn shadow-sm";
                btnNew.className = "px-4 py-2 rounded-lg font-semibold bg-[#d7ccc8] text-[#5d4037] hover:bg-[#c5b9b6] transition-colors";
                currentTokenConfig = {
                    name: "BNK Governance Token",
                    symbol: "BNK",
                    contractAddress: "0xA992ad80Fa6136702382123Ae717890Bc587491d"
                };
            } else {
                btnNew.className = "px-4 py-2 rounded-lg font-bold school-btn shadow-sm";
                btnBnk.className = "px-4 py-2 rounded-lg font-semibold bg-[#d7ccc8] text-[#5d4037] hover:bg-[#c5b9b6] transition-colors";
                // ตรงนี้สามารถเปลี่ยน Contract Address ของ Token ใหม่ได้ในอนาคต
                currentTokenConfig = {
                    name: "New Custom Token",
                    symbol: "NEW",
                    contractAddress: "0x0000000000000000000000000000000000000000" 
                };
                alert("สลับมายังหน้า Token ใหม่ (ยังไม่ได้ระบุ Contract Address จริง)");
                return;
            }
            loadGoogleSheetData();
        }

        function loadGoogleSheetData() {
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    walletMapping = {};
                    results.data.forEach(row => {
                        if(row.Address && row.Who) {
                            walletMapping[row.Address.toLowerCase().trim()] = {
                                who: row.Who,
                                codeWallet: row.CodeWallet,
                                walletName: row.Wallet
                            };
                        }
                    });
                    initBlockchain();
                },
                error: function(err) {
                    console.error("Error loading CSV:", err);
                    alert("ไม่สามารถดึงข้อมูลจาก Google Sheets ได้");
                }
            });
        }

        async function fetchBalancesAndLeaderboard(contract) {
            whoBalances = {};
            const uniqueAddresses = Object.keys(walletMapping);
            
            for (let i = 0; i < uniqueAddresses.length; i++) {
                const addr = uniqueAddresses[i].trim(); 
                if (!ethers.utils.isAddress(addr)) continue;

                try {
                    const bal = await contract.balanceOf(addr);
                    const balFloat = parseFloat(ethers.utils.formatUnits(bal, 18));
                    const who = walletMapping[addr.toLowerCase()].who;
                    
                    if (whoBalances[who]) {
                        whoBalances[who] += balFloat;
                    } else {
                        whoBalances[who] = balFloat;
                    }
                } catch(e) {
                    console.error("ดึงยอดเงินไม่สำเร็จสำหรับ:", addr, e);
                }
                
                await new Promise(resolve => setTimeout(resolve, 200));
            }

            // กรองยอดที่เป็น 0 ออก
            Object.keys(whoBalances).forEach(key => {
                if(whoBalances[key] === 0) delete whoBalances[key];
            });

            renderLeaderboard();
        }

        // ฟังก์ชันสร้างตารางจัดอันดับ (เรียงจากมากไปน้อย)
        function renderLeaderboard() {
            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = '';

            // แปลง object เป็น array แล้วเรียงลำดับตามยอดเหรียญจากมากไปน้อย
            const sortedHolders = Object.entries(whoBalances).sort((a, b) => b[1] - a[1]);

            if (sortedHolders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-[#8d6e63]">ไม่พบข้อมูลยอดถือครอง</td></tr>`;
                return;
            }

            sortedHolders.forEach(([who, amount], index) => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-[#efebe9] hover:bg-[#f5f1eb] transition-colors";
                
                // ตกแต่งลำดับที่ 1-3 ให้ดูเด่นขึ้น
                let rankBadge = `<span class="text-[#8d6e63] font-medium">${index + 1}</span>`;
                if(index === 0) rankBadge = `<span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-bold text-xs">🥇 1</span>`;
                if(index === 1) rankBadge = `<span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded-full font-bold text-xs">🥈 2</span>`;
                if(index === 2) rankBadge = `<span class="bg-orange-50 text-orange-800 px-2 py-0.5 rounded-full font-bold text-xs">🥉 3</span>`;

                tr.innerHTML = `
                    <td class="p-2 text-center">${rankBadge}</td>
                    <td class="p-2 font-medium text-[#4a3b32]">${who}</td>
                    <td class="p-2 text-right font-semibold text-[#5d4037]">${amount.toLocaleString(undefined, {maximumFractionDigits: 2})}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function initBlockchain() {
            if (typeof window.ethereum === 'undefined') {
                alert("ไม่พบ MetaMask! กรุณาติดตั้ง MetaMask เพื่อดูข้อมูล Dashboard");
                document.getElementById('tokenSymbol').innerText = "MetaMask not found";
                return;
            }

            try {
                await window.ethereum.request({ method: 'eth_requestAccounts' });

                const provider = new ethers.providers.Web3Provider(window.ethereum);
                const contract = new ethers.Contract(currentTokenConfig.contractAddress, ABI, provider);

                const [name, symbol, supply] = await Promise.all([
                    contract.name(),
                    contract.symbol(),
                    contract.totalSupply()
                ]);

                document.getElementById('tokenName').innerText = name;
                document.getElementById('tokenSymbol').innerText = symbol;
                
                const formattedSupply = ethers.utils.formatUnits(supply, 18);
                document.getElementById('totalSupply').innerText = parseFloat(formattedSupply).toLocaleString() + " " + symbol;

                await fetchBalancesAndLeaderboard(contract);

                // ดักจับ Event Transfer แบบ Real-time
                contract.on("Transfer", (from, to, value, event) => {
                    const amountFloat = parseFloat(ethers.utils.formatUnits(value, 18));
                    addTransactionToTable(from, to, amountFloat);

                    let needsUpdate = false;
                    const fromLower = from.toLowerCase();
                    const toLower = to.toLowerCase();

                    if (walletMapping[fromLower]) {
                        const whoFrom = walletMapping[fromLower].who;
                        if (whoBalances[whoFrom] !== undefined) {
                            whoBalances[whoFrom] -= amountFloat;
                            if (whoBalances[whoFrom] < 0) whoBalances[whoFrom] = 0;
                            needsUpdate = true;
                        }
                    }

                    if (walletMapping[toLower]) {
                        const whoTo = walletMapping[toLower].who;
                        if (whoBalances[whoTo] !== undefined) {
                            whoBalances[whoTo] += amountFloat;
                        } else {
                            whoBalances[whoTo] = amountFloat;
                        }
                        needsUpdate = true;
                    }

                    if (needsUpdate) renderLeaderboard();
                });

            } catch (error) {
                console.error("Blockchain Connection Error:", error);
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาตรวจสอบเครือข่าย Token X ใน MetaMask");
            }
        }

        function getIdentity(address) {
            const addrLower = address.toLowerCase();
            if (walletMapping[addrLower] && walletMapping[addrLower].who) {
                return `${walletMapping[addrLower].who} <br><span class="text-xs text-[#8d6e63]">(${walletMapping[addrLower].codeWallet})</span>`;
            }
            return `${address.substring(0, 6)}...${address.substring(address.length - 4)}`;
        }

        function addTransactionToTable(from, to, amountFloat) {
            const tbody = document.getElementById('txTableBody');
            const tr = document.createElement('tr');
            tr.className = "border-b border-[#efebe9] hover:bg-[#f5f1eb] transition-colors bg-[#efebe9]/50 duration-500";
            
            tr.innerHTML = `
                <td class="p-3">${getIdentity(from)}</td>
                <td class="p-3">${getIdentity(to)}</td>
                <td class="p-3 text-right font-semibold text-emerald-700">+ ${amountFloat.toLocaleString(undefined, {maximumFractionDigits: 2})}</td>
            `;

            tbody.insertBefore(tr, tbody.firstChild);

            setTimeout(() => {
                tr.classList.remove('bg-[#efebe9]/50');
            }, 1500);
        }

        loadGoogleSheetData();
    </script>
</body>
</html>
