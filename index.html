<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNK Governance Dashboard - School Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body {
            background-color: #fcf8f2;
            color: #4a3b32;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .school-card {
            background-color: #fffdf9;
            border: 2px solid #e6d7c3;
        }
        .school-btn {
            background-color: #8d6e63;
            color: #ffffff;
            transition: background-color 0.2s;
        }
        .school-btn:hover {
            background-color: #6d4c41;
        }
        .school-table-header {
            background-color: #efebe9;
            color: #5d4037;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Tab สำหรับรองรับ Token แบบใหม่ในอนาคต -->
        <div class="flex gap-2 border-b border-[#d7ccc8] pb-2">
            <button onclick="switchToken('BNK')" id="tab-BNK" class="px-4 py-2 rounded-lg font-bold school-btn shadow-sm">
                BNK Governance Token
            </button>
            <button onclick="switchToken('NEW')" id="tab-NEW" class="px-4 py-2 rounded-lg font-semibold bg-[#d7ccc8] text-[#5d4037] hover:bg-[#c5b9b6] transition-colors">
                New Token (Coming Soon)
            </button>
        </div>

        <!-- Header -->
        <div class="school-card p-6 rounded-xl shadow-md flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold" id="tokenName">BNK Governance Token</h1>
                <p class="text-[#8d6e63]" id="tokenSymbol">Loading...</p>
            </div>
            <div class="text-center md:text-right">
                <p class="text-sm text-[#8d6e63]">Total Supply</p>
                <p class="text-2xl font-bold text-[#5d4037]" id="totalSupply">0 BNK</p>
            </div>
        </div>

        <!-- Leaderboard Container -->
        <div class="school-card p-6 rounded-xl shadow-md">
            <div class="flex justify-between items-center mb-4 border-b pb-2 border-[#d7ccc8]">
                <h2 class="text-xl font-bold">🏆 จัดอันดับผู้ถือเหรียญสูงสุดทั้งหมด (Leaderboard)</h2>
                <span id="loadingProgress" class="text-sm text-[#8d6e63] font-medium">กำลังเตรียมโหลด...</span>
            </div>
            <div class="overflow-x-auto max-h-[600px] overflow-y-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="sticky top-0 school-table-header">
                        <tr class="border-b border-[#d7ccc8]">
                            <th class="p-3 text-center w-20">อันดับ</th>
                            <th class="p-3">ชื่อ / Address (Who)</th>
                            <th class="p-3">รหัสกระเป๋า (CodeWallet)</th>
                            <th class="p-3 text-right">จำนวนเหรียญ (BNK)</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <tr>
                            <td colspan="4" class="p-6 text-center text-[#8d6e63]">กำลังเชื่อมต่อบล็อกเชน...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Real-time Transactions Container -->
        <div class="school-card p-6 rounded-xl shadow-md">
            <h2 class="text-xl font-bold mb-4 border-b pb-2 border-[#d7ccc8]">📜 Live Transfers (Real-time)</h2>
            <div class="overflow-x-auto max-h-[400px] overflow-y-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="sticky top-0 school-table-header">
                        <tr class="border-b border-[#d7ccc8]">
                            <th class="p-3">From (Who)</th>
                            <th class="p-3">To (Who)</th>
                            <th class="p-3 text-right">Amount</th>
                        </tr>
                    </thead>
                    <tbody id="txTableBody">
                        <!-- Real-time rows -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        let currentTokenConfig = {
            name: "BNK Governance Token",
            symbol: "BNK",
            contractAddress: "0xA992ad80Fa6136702382123Ae717890Bc587491d"
        };

        // ใช้ GitHub Raw URL โดยตรง เพื่อความเสถียรและป้องกันปัญหา Path บน Netlify
        const DATA_JSON_URL = "https://raw.githubusercontent.com/killswa/jew-school-web-dashboard-token/main/wallets.json";

        const ABI = [
            "function name() view returns (string)",
            "function symbol() view returns (string)",
            "function totalSupply() view returns (uint256)",
            "function balanceOf(address account) view returns (uint256)",
            "event Transfer(address indexed from, address indexed to, uint256 value)"
        ];

        let walletMapping = {};
        let whoBalances = {}; 

        function switchToken(tokenKey) {
            const btnBnk = document.getElementById('tab-BNK');
            const btnNew = document.getElementById('tab-NEW');

            if(tokenKey === 'BNK') {
                btnBnk.className = "px-4 py-2 rounded-lg font-bold school-btn shadow-sm";
                btnNew.className = "px-4 py-2 rounded-lg font-semibold bg-[#d7ccc8] text-[#5d4037] hover:bg-[#c5b9b6] transition-colors";
                currentTokenConfig = {
                    name: "BNK Governance Token",
                    symbol: "BNK",
                    contractAddress: "0xA992ad80Fa6136702382123Ae717890Bc587491d"
                };
            } else {
                btnNew.className = "px-4 py-2 rounded-lg font-bold school-btn shadow-sm";
                btnBnk.className = "px-4 py-2 rounded-lg font-semibold bg-[#d7ccc8] text-[#5d4037] hover:bg-[#c5b9b6] transition-colors";
                currentTokenConfig = {
                    name: "New Custom Token",
                    symbol: "NEW",
                    contractAddress: "0x0000000000000000000000000000000000000000" 
                };
                alert("สลับมายังหน้า Token ใหม่");
                return;
            }
            loadWalletData();
        }

        async function loadWalletData() {
            try {
                const response = await fetch(DATA_JSON_URL);
                const data = await response.json();
                
                walletMapping = {};
                data.forEach(row => {
                    if(row.Address) {
                        const addr = row.Address.toLowerCase().trim();
                        walletMapping[addr] = {
                            who: (row.Who && row.Who.trim() !== "") ? row.Who.trim() : row.Address.trim(),
                            codeWallet: row.CodeWallet ? row.CodeWallet.trim() : "-"
                        };
                    }
                });
                initBlockchain();
            } catch (err) {
                console.error("Error loading JSON data:", err);
                alert("ไม่สามารถโหลดไฟล์ข้อมูลกระเป๋าจาก GitHub ได้");
            }
        }

        async function fetchBalancesAndLeaderboard(contract) {
            whoBalances = {};
            const uniqueAddresses = Object.keys(walletMapping);
            const progressEl = document.getElementById('loadingProgress');
            
            for (let i = 0; i < uniqueAddresses.length; i++) {
                const addr = uniqueAddresses[i]; 
                if (!ethers.utils.isAddress(addr)) continue;

                progressEl.innerText = `กำลังดึงข้อมูล (${i + 1}/${uniqueAddresses.length})...`;

                try {
                    const bal = await contract.balanceOf(addr);
                    const balFloat = parseFloat(ethers.utils.formatUnits(bal, 18));
                    
                    const info = walletMapping[addr];
                    whoBalances[addr] = {
                        displayName: info.who,
                        codeWallet: info.codeWallet,
                        balance: balFloat
                    };
                } catch(e) {
                    console.error("ดึงยอดเงินไม่สำเร็จสำหรับ:", addr, e);
                }
                
                await new Promise(resolve => setTimeout(resolve, 150));
            }

            progressEl.innerText = "โหลดข้อมูลครบถ้วนแล้ว ✓";
            renderLeaderboard();
        }

        function renderLeaderboard() {
            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = '';

            const sortedHolders = Object.values(whoBalances).sort((a, b) => b.balance - a.balance);

            if (sortedHolders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-[#8d6e63]">ไม่พบข้อมูลยอดถือครอง</td></tr>`;
                return;
            }

            sortedHolders.forEach((holder, index) => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-[#efebe9] hover:bg-[#f5f1eb] transition-colors";
                
                let rankBadge = `<span class="text-[#8d6e63] font-medium">${index + 1}</span>`;
                if(index === 0) rankBadge = `<span class="bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full font-bold text-xs">🥇 1</span>`;
                if(index === 1) rankBadge = `<span class="bg-slate-100 text-slate-700 px-2.5 py-1 rounded-full font-bold text-xs">🥈 2</span>`;
                if(index === 2) rankBadge = `<span class="bg-orange-50 text-orange-800 px-2.5 py-1 rounded-full font-bold text-xs">🥉 3</span>`;

                tr.innerHTML = `
                    <td class="p-3 text-center">${rankBadge}</td>
                    <td class="p-3 font-medium text-[#4a3b32]">${holder.displayName}</td>
                    <td class="p-3 text-[#8d6e63] text-sm">${holder.codeWallet}</td>
                    <td class="p-3 text-right font-semibold text-[#5d4037]">${holder.balance.toLocaleString(undefined, {maximumFractionDigits: 2})} BNK</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function initBlockchain() {
            if (typeof window.ethereum === 'undefined') {
                alert("ไม่พบ MetaMask! กรุณาติดตั้ง MetaMask");
                return;
            }

            try {
                await window.ethereum.request({ method: 'eth_requestAccounts' });

                const provider = new ethers.providers.Web3Provider(window.ethereum);
                const contract = new ethers.Contract(currentTokenConfig.contractAddress, ABI, provider);

                const [name, symbol, supply] = await Promise.all([
                    contract.name(),
                    contract.symbol(),
                    contract.totalSupply()
                ]);

                document.getElementById('tokenName').innerText = name;
                document.getElementById('tokenSymbol').innerText = symbol;
                document.getElementById('totalSupply').innerText = parseFloat(ethers.utils.formatUnits(supply, 18)).toLocaleString() + " " + symbol;

                await fetchBalancesAndLeaderboard(contract);

                contract.on("Transfer", (from, to, value) => {
                    const amountFloat = parseFloat(ethers.utils.formatUnits(value, 18));
                    addTransactionToTable(from, to, amountFloat);

                    let needsUpdate = false;
                    const fromLower = from.toLowerCase();
                    const toLower = to.toLowerCase();

                    if (whoBalances[fromLower]) {
                        whoBalances[fromLower].balance -= amountFloat;
                        if (whoBalances[fromLower].balance < 0) whoBalances[fromLower].balance = 0;
                        needsUpdate = true;
                    }
                    if (whoBalances[toLower]) {
                        whoBalances[toLower].balance += amountFloat;
                        needsUpdate = true;
                    }
                    if (needsUpdate) renderLeaderboard();
                });

            } catch (error) {
                console.error("Blockchain Connection Error:", error);
            }
        }

        function getIdentity(address) {
            const addrLower = address.toLowerCase();
            if (walletMapping[addrLower] && walletMapping[addrLower].who !== address) {
                return `${walletMapping[addrLower].who} <br><span class="text-xs text-[#8d6e63]">(${walletMapping[addrLower].codeWallet})</span>`;
            }
            return `${address.substring(0, 6)}...${address.substring(address.length - 4)}`;
        }

        function addTransactionToTable(from, to, amountFloat) {
            const tbody = document.getElementById('txTableBody');
            const tr = document.createElement('tr');
            tr.className = "border-b border-[#efebe9] hover:bg-[#f5f1eb] transition-colors bg-[#efebe9]/50 duration-500";
            
            tr.innerHTML = `
                <td class="p-3">${getIdentity(from)}</td>
                <td class="p-3">${getIdentity(to)}</td>
                <td class="p-3 text-right font-semibold text-emerald-700">+ ${amountFloat.toLocaleString(undefined, {maximumFractionDigits: 2})}</td>
            `;

            tbody.insertBefore(tr, tbody.firstChild);
            setTimeout(() => tr.classList.remove('bg-[#efebe9]/50'), 1500);
        }

        loadWalletData();
    </script>
</body>
</html>
