<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNK Governance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8 font-sans">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Header -->
        <div class="bg-white p-6 rounded-lg shadow-md flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold text-gray-800" id="tokenName">BNK Governance Token</h1>
                <p class="text-gray-500" id="tokenSymbol">Loading...</p>
            </div>
            <div class="text-center md:text-right">
                <p class="text-sm text-gray-500">Total Supply</p>
                <p class="text-2xl font-bold text-blue-600" id="totalSupply">0 BNK</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Pie Chart Container -->
            <div class="bg-white p-6 rounded-lg shadow-md col-span-1 flex flex-col">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Token Distribution (By Who)</h2>
                <div class="flex-grow flex items-center justify-center relative min-h-[300px]">
                    <canvas id="holdersChart"></canvas>
                </div>
            </div>

            <!-- Real-time Transactions Container -->
            <div class="bg-white p-6 rounded-lg shadow-md col-span-1 lg:col-span-2">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Live Transfers (Real-time)</h2>
                <div class="overflow-x-auto max-h-[400px] overflow-y-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="sticky top-0 bg-white">
                            <tr class="bg-gray-50 text-gray-600 text-sm border-b">
                                <th class="p-3">From (Who)</th>
                                <th class="p-3">To (Who)</th>
                                <th class="p-3 text-right">Amount</th>
                            </tr>
                        </thead>
                        <tbody id="txTableBody">
                            <!-- ข้อมูลจะถูกเพิ่มที่นี่อัตโนมัติ -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSuX8P2ftAdB_U1rv9j2eWozaD-1F216lIpVOjCIIf4JbffXzt-aa_JVZmttXNPM1DwBSMssUF0-CRM/pub?output=csv";
        const CONTRACT_ADDRESS = "0xA992ad80Fa6136702382123Ae717890Bc587491d";
        const RPC_URL = "https://rpc.tokenx.finance";

        const ABI = [
            "function name() view returns (string)",
            "function symbol() view returns (string)",
            "function totalSupply() view returns (uint256)",
            "function balanceOf(address account) view returns (uint256)",
            "event Transfer(address indexed from, address indexed to, uint256 value)"
        ];

        let walletMapping = {};
        let whoBalances = {}; 
        let pieChartInstance = null;

        function loadGoogleSheetData() {
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    results.data.forEach(row => {
                        if(row.Address && row.Who) {
                            walletMapping[row.Address.toLowerCase()] = {
                                who: row.Who,
                                codeWallet: row.CodeWallet,
                                walletName: row.Wallet
                            };
                        }
                    });
                    initBlockchain();
                },
                error: function(err) {
                    console.error("Error loading CSV:", err);
                    alert("ไม่สามารถดึงข้อมูลจาก Google Sheets ได้");
                }
            });
        }

        async function fetchBalancesAndDrawChart(contract) {
            whoBalances = {};
            const uniqueAddresses = Object.keys(walletMapping);
            
            // ใช้ Promise.all เพื่อดึง Balance ทุกคนพร้อมกัน (เร็วขึ้น)
            const balancePromises = uniqueAddresses.map(async (addr) => {
                try {
                    const bal = await contract.balanceOf(addr);
                    return { addr, bal };
                } catch(e) {
                    console.error("Error fetching balance for", addr, e);
                    return { addr, bal: ethers.BigNumber.from(0) };
                }
            });

            const results = await Promise.all(balancePromises);

            results.forEach(result => {
                const balFloat = parseFloat(ethers.utils.formatUnits(result.bal, 18));
                const who = walletMapping[result.addr].who;
                
                if(whoBalances[who]) {
                    whoBalances[who] += balFloat;
                } else {
                    whoBalances[who] = balFloat;
                }
            });
            
            // ลบคนที่ยอดเป็น 0 ออกจากกราฟ
            Object.keys(whoBalances).forEach(key => {
                if(whoBalances[key] === 0) delete whoBalances[key];
            });

            drawChart();
        }

        function drawChart() {
            const ctx = document.getElementById('holdersChart').getContext('2d');
            const labels = Object.keys(whoBalances);
            const data = Object.values(whoBalances);
            
            const colors = [
                '#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', 
                '#EC4899', '#06B6D4', '#F97316', '#64748B', '#84CC16'
            ];

            if(pieChartInstance) {
                pieChartInstance.data.labels = labels;
                pieChartInstance.data.datasets[0].data = data;
                pieChartInstance.update();
            } else {
                pieChartInstance = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: data,
                            backgroundColor: colors,
                            borderWidth: 2,
                            borderColor: '#ffffff'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom' },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        let label = context.label || '';
                                        if (label) { label += ': '; }
                                        label += context.parsed.toLocaleString(undefined, {maximumFractionDigits: 2}) + ' BNK';
                                        return label;
                                    }
                                }
                            }
                        }
                    }
                });
            }
        }

        async function initBlockchain() {
            try {
                const provider = new ethers.providers.JsonRpcProvider(RPC_URL);
                const contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, provider);

                const [name, symbol, supply] = await Promise.all([
                    contract.name(),
                    contract.symbol(),
                    contract.totalSupply()
                ]);

                document.getElementById('tokenName').innerText = name;
                document.getElementById('tokenSymbol').innerText = symbol;
                
                const formattedSupply = ethers.utils.formatUnits(supply, 18);
                document.getElementById('totalSupply').innerText = parseFloat(formattedSupply).toLocaleString() + " " + symbol;

                await fetchBalancesAndDrawChart(contract);

                contract.on("Transfer", (from, to, value, event) => {
                    const amountFloat = parseFloat(ethers.utils.formatUnits(value, 18));
                    
                    addTransactionToTable(from, to, amountFloat);

                    let chartNeedsUpdate = false;
                    const fromLower = from.toLowerCase();
                    const toLower = to.toLowerCase();

                    if (walletMapping[fromLower]) {
                        const whoFrom = walletMapping[fromLower].who;
                        if (whoBalances[whoFrom] !== undefined) {
                            whoBalances[whoFrom] -= amountFloat;
                            if (whoBalances[whoFrom] < 0) whoBalances[whoFrom] = 0;
                            chartNeedsUpdate = true;
                        }
                    }

                    if (walletMapping[toLower]) {
                        const whoTo = walletMapping[toLower].who;
                        if (whoBalances[whoTo] !== undefined) {
                            whoBalances[whoTo] += amountFloat;
                        } else {
                            whoBalances[whoTo] = amountFloat;
                        }
                        chartNeedsUpdate = true;
                    }

                    if (chartNeedsUpdate) drawChart();
                });

            } catch (error) {
                console.error("Blockchain Connection Error:", error);
            }
        }

        function getIdentity(address) {
            const addrLower = address.toLowerCase();
            if (walletMapping[addrLower] && walletMapping[addrLower].who) {
                return `${walletMapping[addrLower].who} <br><span class="text-xs text-gray-400">(${walletMapping[addrLower].codeWallet})</span>`;
            }
            return `${address.substring(0, 6)}...${address.substring(address.length - 4)}`;
        }

        function addTransactionToTable(from, to, amountFloat) {
            const tbody = document.getElementById('txTableBody');
            const tr = document.createElement('tr');
            tr.className = "border-b hover:bg-gray-50 transition-colors bg-green-50 duration-500";
            
            tr.innerHTML = `
                <td class="p-3">${getIdentity(from)}</td>
                <td class="p-3">${getIdentity(to)}</td>
                <td class="p-3 text-right font-semibold text-green-600">+ ${amountFloat.toLocaleString(undefined, {maximumFractionDigits: 2})}</td>
            `;

            tbody.insertBefore(tr, tbody.firstChild);

            setTimeout(() => {
                tr.classList.remove('bg-green-50');
            }, 1500);
        }

        loadGoogleSheetData();
    </script>
</body>
</html>
